version: '3.8'

services:
  ai-secretary:
    build: https://github.com/Kyroth88/ai-secretary.git#main
    container_name: ai_secretary
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - IMAP_SERVER=imap.gmail.com
      - SMTP_SERVER=smtp.gmail.com
      - OBSIDIAN_TASKS_PATH=/vault/Tasks.md  # Changed to match /vault
    volumes:
      # Replace /your/actual/host/path with the real directory on your server
      - /your/actual/host/path:/vault
